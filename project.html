<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f1" />
    <meta name="description" content="A project case study from RemiVisuals." />
    <title>Project Case Study | RemiVisuals</title>
    <link rel="canonical" href="https://aderemisalako.me/project" />
    <link rel="icon" type="image/png" href="remi-visuals-icon.png" />
    <link rel="apple-touch-icon" href="remi-visuals-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site">
      <div class="head-row">
        <a class="brand" href="/"><span class="brand-name">Aderemi A. Salako</span> <span class="brand-mark">RemiVisuals</span></a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/portfolio">Showreel</a>
          <a href="/journal">Journal</a>
          <a href="/about">About</a>
          <a href="/notices">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      <article class="case-study wrap" data-case-study>
        <a class="back-link" href="/portfolio">&larr; Back to selected work</a>
        <header class="case-header reveal">
          <p class="kicker" id="case-kicker">Selected feature</p>
          <h1 id="case-title">Project title</h1>
          <p class="case-lede" id="case-summary"></p>
        </header>
        <figure class="case-hero reveal">
          <img id="case-image" src="assets/red-eye-effect-poster.jpg" alt="" width="1920" height="1080" />
          <figcaption id="case-caption">Final frame.</figcaption>
        </figure>
        <div class="case-layout reveal">
          <div>
            <section><h2>The Brief</h2><p id="case-brief"></p></section>
            <section><h2>The Approach</h2><p id="case-approach"></p></section>
          </div>
          <aside class="case-facts">
            <p class="kicker">At a glance</p>
            <dl>
              <div><dt>Role</dt><dd id="case-role"></dd></div>
              <div><dt>Focus</dt><dd id="case-focus"></dd></div>
              <div><dt>Deliverable</dt><dd id="case-deliverable"></dd></div>
            </dl>
            <a class="about-cv case-inquiry" href="/notices">Start a project &rarr;</a>
          </aside>
        </div>
        <section class="case-outcome reveal">
          <h2>Outcome</h2>
          <p id="case-outcome"></p>
        </section>
      </article>
    </main>

    <footer class="site">
      <div class="foot-row">
        <span>&copy; <span id="year"></span> RemiVisuals</span>
        <nav aria-label="Footer links" style="display:flex;gap:16px">
          <a href="/">Home</a>
          <a href="/portfolio">Showreel</a>
          <a href="/journal">Journal</a>
          <a href="/about">About</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
