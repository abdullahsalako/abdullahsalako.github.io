<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f1" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | RemiVisuals</title>
    <link rel="canonical" href="https://aderemisalako.me/journal" />
    <link rel="icon" type="image/png" href="/remi-visuals-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // legacy /article?post=<slug> now lives at /journal/<slug>
      (function () {
        var slug = new URLSearchParams(location.search).get('post');
        location.replace(slug ? '/journal/' + encodeURIComponent(slug) : '/journal');
      })();
    </script>
  </head>
  <body>
    <main id="main-content">
      <section>
        <div class="wrap">
          <p class="note">Taking you to <a href="/journal">the journal</a>&hellip;</p>
        </div>
      </section>
    </main>
  </body>
</html>
