<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfcfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11110f" />
    <meta name="robots" content="noindex" />
    <title>Redirecting | Remi Visuals</title>
    <link rel="canonical" href="https://aderemisalako.me/blog/" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/remi-visuals-icon.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/assets/remi-visuals-icon-dark.png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/theme.css" />
    <script>
      // legacy /article?post=<slug> now lives at /blog/<slug>
      (function () {
        var slug = new URLSearchParams(location.search).get('post');
        location.replace(slug ? '/blog/' + encodeURIComponent(slug) + '/' : '/blog/');
      })();
    </script>
  </head>
  <body>
    <script src="/intro.js"></script>
    <main id="main-content">
      <section>
        <div class="wrap">
          <p class="note">Taking you to <a href="/blog/">the blog</a>&hellip;</p>
        </div>
      </section>
    </main>
  </body>
</html>
